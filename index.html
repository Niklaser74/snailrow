<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#6cc25a">
<meta name="description" content="Luffarsnigel – tre i rad, luffarschack och en kapplöpning, med sniglar. Tre sniglar var som kryper vidare, slemspår som räknas som halv markör, och ett realtidsläge utan turordning. Snail in a Row: noughts and crosses with snails.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Snail in a Row">
<title>Luffarsnigel</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="snails.se">
<meta property="og:title" content="Snail in a Row – noughts and crosses with snails">
<meta property="og:description" content="Sniglarna kryper till sin ruta och slemspåret räknas som en halv markör. / The snails crawl to their square, and the slime trail counts as half a marker.">
<meta property="og:image" content="https://snails.se/snailrow/icons/icon-512.png">
<meta property="og:url" content="https://snails.se/snailrow/">
<link rel="canonical" href="https://snails.se/snailrow/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="board" data-i18n-aria="aria.board" aria-label="Spelbräde"></canvas>
</div>

<!-- HUD -->
<div id="hud" hidden>
  <div class="hud-top">
    <span id="hud-turn" class="team-chip"></span>
    <span id="hud-msg" class="message"></span>
    <div class="hud-btns">
      <button id="btn-undo" class="icon-btn" data-i18n-aria="aria.undo" aria-label="Ångra" hidden>↶</button>
      <button id="btn-mute" class="icon-btn" aria-label="Ljud av">🔊</button>
      <button id="btn-menu" class="icon-btn" data-i18n-aria="aria.menu" aria-label="Meny">☰</button>
    </div>
  </div>
</div>

<!-- Menu -->
<div id="menu" class="overlay">
  <div class="panel">
    <div class="lang" role="group" aria-label="Språk">
      <button data-lang="sv" aria-pressed="true">SV</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    <h1 data-i18n="app.name">Luffarsnigel</h1>
    <p class="tagline" data-i18n="app.tagline">Tre i rad med sniglar. Tre var, och när alla är ute kryper de vidare en ruta i taget.</p>
    <p class="credit" data-i18n="app.credit">Spelidé: Katie Norling</p>
    <div class="opts">
      <label><span data-i18n="menu.mode">Spelläge</span>
        <select id="opt-mode">
          <option value="gentle" data-i18n="mode.gentle">Snällt tre i rad – 3×3, tre sniglar var</option>
          <option value="luffar" data-i18n="mode.luffar">Luffarsnigel – fem i rad på 15×15, slemmet räknas</option>
          <option value="race" data-i18n="mode.race">Kryp i kapp – ingen turordning, sniglarna kryper i kapp</option>
        </select></label>
      <label><span data-i18n="menu.opponent">Motståndare</span>
        <select id="opt-opponent">
          <option value="human" data-i18n="opp.human">Två spelare, samma enhet</option>
          <option value="easy" data-i18n="opp.easy">Dator – lätt</option>
          <option value="normal" data-i18n="opp.normal">Dator – normal</option>
          <option value="hard" data-i18n="opp.hard">Dator – svår</option>
        </select></label>
      <label><span data-i18n="menu.side">Du spelar</span>
        <select id="opt-side">
          <option value="1" data-i18n="side.1">Gul (börjar)</option>
          <option value="2" data-i18n="side.2">Blå</option>
          <option value="random" data-i18n="side.random">Slumpa</option>
        </select></label>
      <label><span data-i18n="menu.speed">Snigelfart</span>
        <select id="opt-speed">
          <option value="fast" data-i18n="speed.fast">Rask, för att vara snigel</option>
          <option value="normal" data-i18n="speed.normal">Lagom</option>
          <option value="snail" data-i18n="speed.snail">Riktig snigel</option>
        </select></label>
    </div>
    <div class="actions">
      <button id="btn-continue" class="btn secondary" hidden data-i18n="menu.continue">Fortsätt partiet</button>
      <button id="btn-start" class="btn primary" data-i18n="menu.start">Nytt parti</button>
      <button id="btn-help" class="btn secondary" data-i18n="menu.help">Så spelar du</button>
      <button id="btn-install" class="btn secondary" hidden data-i18n="menu.install">Installera app</button>
    </div>
    <p id="offline-hint" class="hint"></p>
    <footer>
      <span data-i18n="app.by">En <a href="https://knackpot.se" target="_blank" rel="noopener">Knackpot</a>-produkt</span>
      · <a href="https://snails.se/" data-i18n="app.hub">Fler snigelspel på snails.se</a>
      · <span id="menu-version"></span>
    </footer>
  </div>
</div>

<!-- Help -->
<div id="help" class="overlay" hidden>
  <div class="panel">
    <h2 data-i18n="help.title">Så spelar du</h2>
    <p data-i18n="help.1"></p>
    <p data-i18n="help.2"></p>
    <p data-i18n="help.3"></p>
    <p data-i18n="help.4"></p>
    <p data-i18n="help.6"></p>
    <p data-i18n="help.5"></p>
    <div class="actions"><button id="btn-help-close" class="btn primary" data-i18n="help.close">Stäng</button></div>
  </div>
</div>

<!-- Game over -->
<div id="over" class="overlay" hidden>
  <div class="panel small">
    <h2 id="over-title"></h2>
    <p id="over-why" class="why"></p>
    <div class="actions">
      <button id="btn-again" class="btn primary" data-i18n="over.again">Spela igen</button>
      <button id="btn-over-menu" class="btn secondary" data-i18n="over.menu">Till menyn</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
